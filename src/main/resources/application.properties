quarkus.application.name=pgvault-operator

# Genera los CRD en target/kubernetes durante el build.
quarkus.operator-sdk.crd.generate=true

# Genera tambien los CRD que aun no tienen reconciler. Backup y Restore ya
# tienen su API definida, pero sus controladores llegan en los modulos 4 y 7.
quarkus.operator-sdk.crd.generate-all=true

# En desarrollo, aplica los CRD al cluster al arrancar. Ahorra un kubectl apply
# manual cada vez que cambia la API, que en el modulo 2 va a ser constante.
# En produccion los CRD los instala el chart de Helm, nunca el propio operator:
# aplicar CRD requiere permisos de cluster que un operator no deberia tener.
%dev.quarkus.operator-sdk.crd.apply=true

quarkus.log.category."io.pgvault".level=DEBUG
quarkus.log.category."io.javaoperatorsdk".level=INFO

# Imagen que ejecutan los Jobs de backup, restauracion y limpieza. Se configura
# aqui y no en los CRD porque es una decision de quien instala el operator, no de
# quien escribe una politica: el chart de Helm del modulo 10 la fija al digest
# publicado, y en desarrollo apunta a la imagen que carga kind.
pgvault.runner.image=pgvault/runner:dev

# IfNotPresent, no Always: en kind la imagen se mete en los nodos con kind load y
# no existe en ningun registro, asi que cualquier intento de descarga terminaria
# en ImagePullBackOff. Con Never seria peor todavia, porque un despliegue real
# contra un registro de verdad no arrancaria nunca.
pgvault.runner.image-pull-policy=IfNotPresent
