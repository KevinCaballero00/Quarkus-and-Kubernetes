quarkus.application.name=pgvault-operator

# Genera los CRD en target/kubernetes durante el build.
quarkus.operator-sdk.crd.generate=true

# En desarrollo, aplica los CRD al cluster al arrancar. Ahorra un kubectl apply
# manual cada vez que cambia la API, que en el modulo 2 va a ser constante.
# En produccion los CRD los instala el chart de Helm, nunca el propio operator:
# aplicar CRD requiere permisos de cluster que un operator no deberia tener.
%dev.quarkus.operator-sdk.crd.apply=true

quarkus.log.category."io.pgvault".level=DEBUG
quarkus.log.category."io.javaoperatorsdk".level=INFO
