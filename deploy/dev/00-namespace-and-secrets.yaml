# Entorno de desarrollo. NO usar en produccion: las credenciales estan en claro
# a proposito, para que el clusterse pueda recrear desde cero sin pasos manuales.
#
# Las claves de los Secret coinciden con los valores por defecto del esquema
# (username, password, AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY), asi que una
# BackupPolicy no necesita declarar ningun campo *Key.
apiVersion: v1
kind: Namespace
metadata:
  name: pgvault-system
---
apiVersion: v1
kind: Secret
metadata:
  name: orders-db
  namespace: pgvault-system
type: Opaque
stringData:
  username: pgvault
  password: pgvault-dev-password
---
apiVersion: v1
kind: Secret
metadata:
  name: staging-db
  namespace: pgvault-system
type: Opaque
stringData:
  username: pgvault
  password: pgvault-dev-password
---
apiVersion: v1
kind: Secret
metadata:
  name: minio-creds
  namespace: pgvault-system
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: pgvault
  AWS_SECRET_ACCESS_KEY: pgvault-dev-password
