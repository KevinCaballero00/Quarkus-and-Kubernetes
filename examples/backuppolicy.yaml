# Politica completa. Apunta al PostgreSQL y al MinIO que despliega el modulo 3.
#
# Casi todo el spec es opcional: formato, compresion, concurrencia, zona horaria
# y puerto tienen valor por defecto en el esquema, asi que el servidor de API los
# rellena solo. Se dejan escritos aqui para que el ejemplo sirva de referencia.
apiVersion: pgvault.io/v1alpha1
kind: BackupPolicy
metadata:
  name: orders-nightly
  namespace: default
spec:
  schedule: "0 3 * * *"
  timeZone: America/Bogota
  concurrencyPolicy: Forbid

  # Cuanto puede llegar tarde un disparo y seguir mereciendo la pena. Manda
  # cuando el operator vuelve de una caida: con esto, un disparo de las 3:00 que
  # se descubre a las 5:00 se ejecuta igual, pero uno de hace dos dias no. Si se
  # omite, se recupera por viejo que sea. En ningun caso se recuperan varios: se
  # ejecuta como mucho el ultimo que se perdio.
  startingDeadlineSeconds: 7200

  source:
    host: postgres.pgvault-system.svc.cluster.local
    port: 5432
    database: orders
    sslMode: Prefer
    credentialsSecretRef:
      name: orders-db

  destination:
    s3:
      endpoint: http://minio.pgvault-system.svc.cluster.local:9000
      bucket: pg-backups
      prefix: orders/
      forcePathStyle: true
      credentialsSecretRef:
        name: minio-creds

  format: Custom
  compression: Zstd

  # Los cuatro criterios keep* se suman: una copia sobrevive si la salva
  # cualquiera de ellos. maxAge es el unico que resta, se aplica al final y gana
  # a los demas, asi que aqui ninguna copia pasa de 30 dias por mucho que
  # keepWeekly quisiera guardar cuatro semanas justas.
  #
  # La copia correcta mas reciente no se borra nunca, tampoco por maxAge.
  retention:
    keepLast: 7
    keepWeekly: 4
    maxAge: 30d
