# Clúster de desarrollo para pgvault.
#
# Tres nodos a propósito: con un solo nodo nunca verías si el operator asume
# afinidad o almacenamiento local sin declararlo. Los Jobs de backup deben poder
# aterrizar en cualquier worker y seguir funcionando.
#
#   kind create cluster --config hack/kind-cluster.yaml
#   kind delete cluster --name pgvault-dev
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: pgvault-dev
nodes:
  - role: control-plane
  - role: worker
  - role: worker
